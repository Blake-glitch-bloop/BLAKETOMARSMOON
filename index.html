<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf6ec">
  <meta name="description" content="A little builder. A big dream. An interactive space storybook for little explorers. Tap, build, draw, and fly to Mars with Lil’ Johnny.">
  <title>Lil’ Johnny Builds to Mars — An interactive storybook</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Back to book cover"><span class="brand-mark">✦</span> little big stories<span class="brand-dot">®</span></a>
    <span class="edition">SMALL HANDS. BIG IMAGINATIONS.</span>
    <div class="tools">
      <button id="sound" class="icon-button" aria-label="Turn sound on" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6"/></svg></button>
      <button id="read" class="read-button" aria-label="Read this page aloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c4-1 7 0 9 2 2-2 5-3 9-2v14c-4-1-7 0-9 2-2-2-5-3-9-2zM12 7v14"/></svg><span>Read to me</span></button>
    </div>
  </header>
  <main>
    <div class="book-topline"><span><i></i> A HANDS-ON SPACE ADVENTURE</span><span class="age-note">Made for little explorers, ages 3–7</span></div>
    <article id="book" class="book" aria-label="Interactive storybook">
      <div class="page-grain" aria-hidden="true"></div>
      <section id="story" class="story"></section>
      <section id="scene" class="scene" aria-label="Interactive illustration"></section>
      <div id="live" class="sr-only" role="status" aria-live="polite"></div>
      <div class="page-corner" aria-hidden="true"></div>
    </article>
    <nav class="book-nav" aria-label="Story pages">
      <button id="previous" class="nav-button" aria-label="Previous page"><span>←</span> <span class="nav-label">Back a page</span></button>
      <div class="page-position"><div id="page-dots" class="page-dots"></div><span id="page-count">THE COVER</span></div>
      <button id="next" class="nav-button next"><span class="nav-label">Let’s begin</span> <span>→</span></button>
    </nav>
    <footer class="under-book"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg> A little curiosity goes a long way.</span><span>Tap. Play. Imagine.</span></footer>
  </main>
</body>
</html>
